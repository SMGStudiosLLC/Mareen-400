name: validate

on:
  push:
  workflow_dispatch:

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Compile the embedded Metal source with Apple's compiler
        run: |
          python3 - <<'PY'
          import re, pathlib
          s = pathlib.Path("MarennFilter.swift").read_text()
          m = re.search(r'static let source = """\n(.*?)\n\s*"""', s, re.S)
          pathlib.Path("marenn.metal").write_text(m.group(1))
          PY
          xcrun -sdk iphoneos metal -std=metal3.0 -Werror -c marenn.metal -o marenn_ios.air
          xcrun -sdk macosx metal -Werror -c marenn.metal -o marenn_mac.air
      - name: Type-check the app file against the iOS SDK
        run: |
          xcrun -sdk iphoneos swiftc -typecheck -target arm64-apple-ios16.0 MarennFilter.swift
      - name: Build the command line tool
        run: |
          if grep -q "@main" Tools/marenn_cli.swift; then
            swiftc -O -parse-as-library MarennFilter.swift Tools/marenn_cli.swift -o marenn
          else
            swiftc -O Tools/marenn_cli.swift -o marenn
          fi
      - name: Metal device check and render
        run: |
          system_profiler SPDisplaysDataType | head -20 || true
          mkdir -p ci-out
          if grep -q "@main" Tools/marenn_cli.swift; then
            ./marenn Examples/original-rooftop.jpg ci-out/rooftop.png --seed 3 || echo "render failed"
            ./marenn Examples/original-surf.jpg ci-out/surf.png --seed 3 || echo "render failed"
          else
            ./marenn MarennFilter.swift Examples/original-rooftop.jpg ci-out/rooftop.png --seed 3 || echo "render failed"
            ./marenn MarennFilter.swift Examples/original-surf.jpg ci-out/surf.png --seed 3 || echo "render failed"
          fi
          ls -la ci-out
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ci-out
          if-no-files-found: ignore
