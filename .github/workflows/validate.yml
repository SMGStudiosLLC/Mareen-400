name: validate

on:
  push:
  workflow_dispatch:

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compile the embedded Metal source with Apple's compiler
        run: |
          python3 - <<'PY'
          import re, pathlib
          s = pathlib.Path("MarennFilter.swift").read_text()
          m = re.search(r'static let source = """\n(.*?)\n\s*"""', s, re.S)
          pathlib.Path("marenn.metal").write_text(m.group(1))
          PY
          xcrun -sdk iphoneos metal -std=metal3.0 -Werror -c marenn.metal -o marenn_ios.air
          xcrun -sdk macosx metal -Werror -c marenn.metal -o marenn_mac.air

      - name: Type-check the app file against the iOS SDK
        run: xcrun -sdk iphoneos swiftc -typecheck -target arm64-apple-ios16.0 MarennFilter.swift

      - name: Build the command line tool
        run: swiftc -O -parse-as-library MarennFilter.swift Tools/marenn_cli.swift -o marenn

      - name: Python and the CPU reference renderer
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy pillow
          Tools/cpu/build.sh

      - name: Render on the GPU and on the CPU reference, compare
        run: |
          mkdir -p ci-in ci-out
          .venv/bin/python - <<'PY'
          from PIL import Image
          for n in ["rooftop", "surf"]:
              Image.open(f"Examples/original-{n}.jpg").convert("RGB").save(f"ci-in/{n}.png")
          PY
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal" || true
          status=0
          for n in rooftop surf; do
            ./marenn ci-in/$n.png ci-out/${n}_gpu.png --seed 3 --variation 0
            .venv/bin/python Tools/cpu/marenn.py ci-in/$n.png ci-out/${n}_cpu.png --seed 3 --variation 0
            .venv/bin/python Tools/cpu/compare.py ci-out/${n}_gpu.png ci-out/${n}_cpu.png || status=1
          done
          ./marenn ci-in/rooftop.png ci-out/rooftop_extras_gpu.png --seed 9 --stamp 2026-11-21 --leak 0.7
          .venv/bin/python Tools/cpu/marenn.py ci-in/rooftop.png ci-out/rooftop_extras_cpu.png --seed 9 --stamp 2026-11-21 --leak 0.7
          .venv/bin/python Tools/cpu/compare.py ci-out/rooftop_extras_gpu.png ci-out/rooftop_extras_cpu.png || status=1
          exit $status

      - name: Wide gamut input (Display P3 colours outside sRGB)
        run: |
          .venv/bin/python - <<'PY'
          import colorsys
          from PIL import Image
          w, h = 1200, 800
          im = Image.new("RGB", (w, h))
          px = im.load()
          for y in range(h):
              for x in range(w):
                  hue, light = x / w, 0.15 + 0.7 * (y / h)
                  r, g, b = colorsys.hls_to_rgb(hue, light, 1.0)
                  px[x, y] = (int(r * 255), int(g * 255), int(b * 255))
          im.save("ci-in/chart.png")
          PY
          cp ci-in/chart.png ci-in/chart_p3.png
          sips --embedProfile "/System/Library/ColorSync/Profiles/Display P3.icc" ci-in/chart_p3.png --out ci-in/chart_p3.png
          sips -g profile ci-in/chart_p3.png
          ./marenn ci-in/chart.png ci-out/chart_srgb_gpu.png --seed 2 --variation 0 --nograin
          ./marenn ci-in/chart_p3.png ci-out/chart_p3_gpu.png --seed 2 --variation 0 --nograin
          cp ci-in/chart.png ci-in/chart_p3.png ci-out/

      - name: Look regression checks (grain isotropy, on-screen consistency, determinism)
        run: .venv/bin/python Tools/cpu/check_look.py

      - name: GPU timing at phone capture sizes
        run: |
          .venv/bin/python - <<'PY'
          from PIL import Image
          im = Image.open("Examples/original-rooftop.jpg").convert("RGB")
          im.resize((3024, 4032), Image.LANCZOS).save("ci-in/12mp.png")
          im.resize((4284, 5712), Image.LANCZOS).save("ci-in/24mp.png")
          PY
          for n in 12mp 24mp; do
            for run in 1 2 3; do ./marenn ci-in/$n.png ci-out/timing_$n.jpg --seed 1; done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: ci-out
          if-no-files-found: ignore
